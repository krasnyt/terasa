<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Plánovač pokládky terasy</title>
    <link rel="stylesheet" href="styles.css?v=21" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="controls" aria-label="Nastavení návrhu">
        <div class="brand-block">
          <div class="brand-mark" aria-hidden="true"></div>
          <div>
            <h1>Plánovač pokládky terasy</h1>
            <p>Interaktivní návrh řezání, spotřeby a rozmístění prken.</p>
          </div>
        </div>

        <section class="panel">
          <h2>Rozměry</h2>
          <div class="field-grid">
            <label>
              <span class="label-row">
                Délka terasy
                <button class="help-dot" type="button" aria-label="Nápověda k délce terasy" data-tooltip="Celkový rozměr terasy ve směru pokládky prken. Aplikace podle něj určuje délky jednotlivých dílů.">?</button>
              </span>
              <span class="input-unit">
                <input id="terraceLength" type="number" min="500" step="50" />
                <span>mm</span>
              </span>
            </label>
            <label>
              <span class="label-row">
                Šířka terasy
                <button class="help-dot" type="button" aria-label="Nápověda k šířce terasy" data-tooltip="Rozměr napříč prkny. Z této hodnoty se vypočítá počet řad prken.">?</button>
              </span>
              <span class="input-unit">
                <input id="terraceWidth" type="number" min="300" step="50" />
                <span>mm</span>
              </span>
            </label>
            <label>
              <span class="label-row">
                Délka prkna
                <button class="help-dot" type="button" aria-label="Nápověda k délce prkna" data-tooltip="Délka jednoho koupeného prkna před řezáním. Z ní se skládá řezný plán a počet kusů k nákupu.">?</button>
              </span>
              <span class="input-unit">
                <input id="boardLength" type="number" min="500" step="50" />
                <span>mm</span>
              </span>
            </label>
            <label>
              <span class="label-row">
                Šířka prkna
                <button class="help-dot" type="button" aria-label="Nápověda k šířce prkna" data-tooltip="Pohledová šířka jednoho prkna. Společně s mezerou určuje rozteč a počet řad.">?</button>
              </span>
              <span class="input-unit">
                <input id="boardWidth" type="number" min="40" step="5" />
                <span>mm</span>
              </span>
            </label>
            <label>
              <span class="label-row">
                Mezera
                <button class="help-dot" type="button" aria-label="Nápověda k mezeře" data-tooltip="Vzdálenost mezi sousedními prkny. Započítává se mezi řadami v celé šířce terasy.">?</button>
              </span>
              <span class="input-unit">
                <input id="gap" type="number" min="0" step="1" />
                <span>mm</span>
              </span>
            </label>
            <label>
              <span class="label-row">
                Min. odřezek
                <button class="help-dot" type="button" aria-label="Nápověda k minimálnímu odřezku" data-tooltip="Nejkratší díl, který je ještě vhodné použít. Automat se snaží nevytvářet kratší kusy.">?</button>
              </span>
              <span class="input-unit">
                <input id="minOffcut" type="number" min="0" step="10" />
                <span>mm</span>
              </span>
            </label>
          </div>
        </section>

        <section class="panel">
          <h2>Vzor pokládky</h2>
          <div class="mode-panel">
            <label>
              <span class="label-row">
                Opakování vzoru
                <button class="help-dot" type="button" aria-label="Nápověda k opakování vzoru" data-tooltip="Po kolika řadách se má vzor spár opakovat. Posun spár se dopočítá tak, aby byl vzor pravidelný a odpad co nejmenší.">?</button>
              </span>
              <span class="input-unit">
                <input id="patternRows" type="number" min="2" max="12" step="1" />
                <span>řad</span>
              </span>
            </label>
            <label>
              <span class="label-row">
                Odsazení krajních hranolovníků
                <button class="help-dot" type="button" aria-label="Nápověda k odsazení krajních hranolovníků" data-tooltip="Vzdálenost prvního a posledního hranolovníku od kraje terasy.">?</button>
              </span>
              <span class="input-unit">
                <input id="joistEdgeOffset" type="number" min="0" step="10" />
                <span>mm</span>
              </span>
            </label>
          </div>
        </section>

        <section class="panel summary-panel">
          <h2>Výstup</h2>
          <dl id="summary" class="summary-list"></dl>
        </section>
      </aside>

      <section class="workspace" aria-label="Výkres terasy">
        <header class="workspace-header">
          <div>
            <h2>Návrh pokládky</h2>
            <p>Změna vstupu okamžitě přepočítá řezný plán i vizualizaci.</p>
          </div>
          <div class="legend">
            <span><i class="legend-board"></i> prkno</span>
            <span><i class="legend-gap"></i> mezera</span>
            <span><i class="legend-seam"></i> rez</span>
          </div>
        </header>

        <div class="drawing-frame">
          <svg id="deckSvg" role="img" aria-label="Vizualizace pokládky terasy"></svg>
          <div id="boardTooltip" class="board-tooltip" role="tooltip"></div>
        </div>

        <div class="bottom-grid">
          <section class="panel cut-panel">
            <h2>Řezný plán</h2>
            <div id="cutList" class="cut-list"></div>
          </section>
          <section class="panel notes-panel">
            <h2>Poznámky</h2>
            <ul id="warnings" class="warnings"></ul>
          </section>
        </div>
      </section>
    </main>

    <script src="app.js?v=31" defer></script>
  </body>
</html>
